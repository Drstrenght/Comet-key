<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeKey Admin</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <!-- Login -->
    <div id="loginScreen" class="card">
      <h1>SafeKey</h1>
      <p class="subtitle">Admin Control Panel</p>
      <input type="password" id="password" placeholder="Password" />
      <button onclick="login()">Login</button>
      <p id="loginError" class="error"></p>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden">
      <div class="header">
        <h1>SafeKey Dashboard</h1>
        <button onclick="logout()">Logout</button>
      </div>

      <div class="card">
        <h2>Update Protected Script</h2>
        <p class="info">This script will be freshly obfuscated with Prometheus on every load</p>
        <textarea id="scriptInput" rows="12" placeholder="-- Paste your clean script here..."></textarea>
        <button onclick="updateScript()">Save & Protect</button>
        <p id="saveStatus" class="status"></p>
      </div>

      <div class="card">
        <h2>Generate Key</h2>
        <div class="form-row">
          <input type="number" id="days" value="30" placeholder="Days" />
          <input type="number" id="maxSessions" value="1" placeholder="Max sessions" />
        </div>
        <button onclick="generateKey()">Generate</button>
        <p id="keyOutput" class="key"></p>
      </div>
    </div>
  </div>

  <script src="/script.js"></script>
</body>
</html>
