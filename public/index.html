<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login">
    <h2>Login</h2>
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
</div>

<div id="dashboard" style="display:none;">
    <h2>Dashboard</h2>

    <textarea id="scriptArea" placeholder="Paste Lua script..."></textarea>
    <button onclick="saveScript()">Save Script</button>

    <h3>Generate Key</h3>
    <input id="days" type="number" placeholder="Days">
    <input id="sessions" type="number" placeholder="Max Sessions">
    <button onclick="genKey()">Generate</button>

    <p id="output"></p>
</div>

<script src="script.js"></script>
</body>
</html>
